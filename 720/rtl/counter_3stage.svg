<text x="35.0" y="1079.0" class="small">Blue: transition   Green: reset   Gray dashed: hold   Orange dashed: recovery from another encoding</text>
<text x="35.0" y="1100.0" class="small">Guards are symbolic, two-state control conditions. Each register is analysed separately; DEFAULT is not a declared state.</text>
