<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1134" viewBox="0 0 1840 1134" role="img" aria-labelledby="document-title document-description">
<title id="document-title">State machines: rw_fsm.v</title><desc id="document-description">State transition diagrams with numbered arrows and full transition conditions. Each FSM is shown separately; conditions on other registers remain in the guards.</desc>
<defs>
<marker id="arrow-transition" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-reset" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-hold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-recovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
</defs>
<style>
text{font-family:system-ui,-apple-system,"DejaVu Sans",sans-serif;fill:#17243a;font-size:15px}
.page{fill:#f1f5fb}.panel{fill:white;stroke:#d8e1ee;stroke-width:1.3}
.title{font-size:29px;font-weight:750}.subtitle{font-size:15px;fill:#52647c}
.machine-title{font-size:23px;font-weight:700}.section-title{font-size:17px;font-weight:700}
.node{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.default-node{fill:#fff7ed;stroke:#d97706;stroke-width:1.8;stroke-dasharray:6 4}
.reset-node{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}.state-name{text-anchor:middle;font-family:"DejaVu Sans Mono",Consolas,monospace;font-weight:700;font-size:14px}
.encoding{text-anchor:middle;fill:#64748b;font-family:monospace;font-size:12px}
.edge{fill:none;stroke-width:1.9}.edge-transition{stroke:#2563eb}.edge-reset{stroke:#059669}.edge-hold{stroke:#64748b;stroke-dasharray:5 4}.edge-recovery{stroke:#d97706;stroke-dasharray:7 4}
.arrow-label{font-family:monospace;font-size:12px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round}
.condition{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:13px}
.row-name{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:13px;font-weight:650}.edge-id{font-family:monospace;font-size:14px;font-weight:700}
.small{font-size:12px;fill:#64748b}.divider{stroke:#e2e8f0;stroke-width:1}
.hover-edge:hover .edge{stroke-width:4}.hover-edge:hover .arrow-label{font-size:14px}
</style>
<rect x="0.0" y="0.0" width="1840.0" height="1134.0" rx="0.0" class="page"/>
<text x="34.0" y="49.0" class="title">Verilog state transition diagrams</text>
<text x="35.0" y="79.0" class="subtitle">rw_fsm.v  |  1 FSM(s)  |  statemachine 1.1.0</text>
<text x="35.0" y="105.0" class="subtitle">Arrow IDs link the diagram to complete conditions. Hover an arrow for its condition and source line.</text>
