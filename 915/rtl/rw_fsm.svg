<text x="24.0" y="63.0" class="subtitle">register: CURT_STATE | next-state: NXT_STATE | @(posedge CLK or negedge RST_N)</text>
<text x="24.0" y="88.0" class="small">Normal transitions require: RST_N. Reset rows carry their own condition.</text>
